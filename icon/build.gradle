plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id "org.jetbrains.kotlin.plugin.compose"
}

ext {
    PUBLISH_GROUP_ID = rootProject.groupId
    PUBLISH_VERSION = rootProject.versionName
    PUBLISH_ARTIFACT_ID = "icon"
}

apply from: "${rootProject.projectDir}/scripts/vannitech-mavencentral.gradle"

android {
    compileSdk rootProject.compileSdk

    buildFeatures.buildConfig = true
    defaultConfig {
        minSdk rootProject.minSdk
        targetSdk rootProject.targetSdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    kotlin {
        jvmToolchain(21)
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
    namespace 'com.dadino.quickstart3.icon'

    buildFeatures {
        compose = true
    }
}

dependencies {
    implementation project(":contextformattable")
    implementation project(":base")
    implementation project(":color")

    implementation 'androidx.annotation:annotation:1.9.1'
    implementation "androidx.core:core-ktx:$core_ktx_version"

    //COMPOSE
    implementation platform("androidx.compose:compose-bom:$compose_bom")
    implementation 'androidx.compose.ui:ui'
    implementation "androidx.compose.ui:ui-graphics"
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation "androidx.compose.ui:ui-tooling"
    implementation 'androidx.compose.material3:material3'
}